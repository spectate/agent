# Publishes a GitHub release for every v2.x.y tag (git tag -s v2.0.0 && git push origin v2.0.0).
# Stable releases become "latest"; v2.x.y-rc.N tags are pre-releases.
name: Release

on:
  push:
    tags:
      - "v2.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: vet + test -race
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=darwin go vet ./...
          go test -race ./...

  release:
    name: goreleaser
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Never publish an unsigned release: agents verify checksums.txt.sig
      # with the public key embedded at build time (README "Release signing").
      - name: Require the release signing key
        env:
          SPECTATE_RELEASE_SIGNING_KEY: ${{ secrets.SPECTATE_RELEASE_SIGNING_KEY }}
          SPECTATE_RELEASE_PUBLIC_KEY: ${{ vars.SPECTATE_RELEASE_PUBLIC_KEY }}
        run: |
          if [ -z "$SPECTATE_RELEASE_SIGNING_KEY" ] || [ -z "$SPECTATE_RELEASE_PUBLIC_KEY" ]; then
            echo "::error title=Release signing::Set the SPECTATE_RELEASE_SIGNING_KEY secret and the SPECTATE_RELEASE_PUBLIC_KEY variable (README, Release signing)"
            exit 1
          fi

      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPECTATE_RELEASE_SIGNING_KEY: ${{ secrets.SPECTATE_RELEASE_SIGNING_KEY }}
          SPECTATE_RELEASE_PUBLIC_KEY: ${{ vars.SPECTATE_RELEASE_PUBLIC_KEY }}
